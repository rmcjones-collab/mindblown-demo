<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindBlown — the Brain, exploded</title>
<meta name="description" content="MindBlown explodes the Perplexity Brain into lobes, neurons and synapses so you can zoom in and see how everything connects.">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="icon" href="brand/mindblown-logo-small.svg">
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./modifiers.css">
</head>
<body>
<div id="stage">
  <canvas id="brain" aria-label="Interactive map of the knowledge brain: lobes, neurons and synapses" role="img"></canvas>

  <header id="top">
    <div class="brand">
      <a class="home" href="index.html" title="MindBlown home" style="display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none">
      <img class="mark" src="brand/mindblown-logo-small.svg" width="26" height="26" alt="" aria-hidden="true">
      <div class="brand-text">
        <span class="title">MindBlown</span>
        <span class="sub">the Brain, exploded into synapses</span>
      </div>
      </a>
      <nav class="brains" aria-label="Brains"><a href="index.html">Home</a><span class="sep" aria-hidden="true"></span><a href="projects.html" class="on">Projects</a><a href="life.html">Life</a><a href="programming.html">Programming</a><a href="build.html">Build</a><a href="https://gtabrain.pplx.app" class="ext" title="GTA network: a separate MindBlown site">GTA network ↗</a><a href="https://brain42.pplx.app" class="ext" title="Brain 42: Life, the Universe and Everything (neural edition)">42 ↗</a></nav>
    </div>

    <div class="search" role="search">
      <input id="q" type="search" placeholder="Find a neuron or synapse…" autocomplete="off" aria-label="Search neurons and synapses">
      <ul id="results" class="results" role="listbox" hidden></ul>
    </div>

    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <aside id="lobes" aria-label="Lobes">
    <div class="lobes-head">Lobes</div>
    <div id="lobe-list"></div>
    <div class="switches">
      <label class="switch"><input type="checkbox" id="explode-all"><span>Explode every neuron</span></label>
      <label class="switch"><input type="checkbox" id="cocite"><span>Shared-source threads</span></label>
    </div>
  </aside>

  <div id="level" class="level" aria-live="polite">
    <span class="dot"></span><span id="level-text">Lobes</span>
    <span class="hint" id="hint">scroll to zoom · drag to pan · click a neuron</span>
  </div>

  <div id="zoom-ctl" class="zoom-ctl" role="group" aria-label="Zoom">
    <button id="z-in" aria-label="Zoom in">+</button>
    <button id="z-out" aria-label="Zoom out">−</button>
    <button id="z-fit" aria-label="Fit whole brain" title="Fit whole brain">⌂</button>
  </div>

  <div id="tip" class="tip" hidden></div>

  <aside id="panel" class="panel" hidden aria-label="Details">
    <button class="close" id="panel-close" aria-label="Close details">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="loading" class="loading"><div class="pulse"></div><span>Waking up the brain…</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="./data.js"></script>
<script src="./brain-nav.js"></script>
<script src="./app.js"></script>
<script src="./modifier-engine.js"></script>
<script src="./modifiers.js"></script>
<script src="./network-nav.js"></script>
</body>
</html>
