# CodeRabbit configuration shared across the MindBlown repositories.
# Review PRs are opened against frozen review-base/* branches, not the default branch; CodeRabbit only auto-reviews PRs
# that target the default branch or a branch listed under base_branches, so without this entry each review pass has to
# be triggered by hand with "@coderabbitai review".
language: en-US
reviews:
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - "^review-base/.*$"
    auto_incremental_review: true
